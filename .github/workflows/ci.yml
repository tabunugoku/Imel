name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Imel.sln -c Release
      - name: Regression tests
        run: dotnet run --project Tests/Imel.RegressionTests.csproj -c Release
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Imel-${{ github.sha }}
          path: bin/Release/net10.0-windows/
          if-no-files-found: error
          retention-days: 14
